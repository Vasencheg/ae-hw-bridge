[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ae-hw-bridge"
dynamic = ["version"]
description = "FastMCP server for AE-HW-BRIDGE dual-CDC hardware test bench"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Vasencheg", email = "vasencheg@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.3.0,<2.0.0",
    "pyserial>=3.5",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
ae-hw-bridge = "ae_hw_bridge.mcp.server:main"
ae-hw-bridge-mcp = "ae_hw_bridge.mcp.server:main"
ae-hw-bridge-daemon = "ae_hw_bridge.daemon.server:main"

[tool.hatch.version]
path = "src/ae_hw_bridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ae_hw_bridge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

